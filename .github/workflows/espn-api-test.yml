name: Integration Tests
on:
  schedule:
    # Run once a day
    - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run integration tests
        run: |
          uv run pytest tests/football/integration/ -q || true
          uv run pytest tests/basketball/integration/ -q || true
          uv run pytest tests/hockey/integration/ -q || true
          uv run pytest tests/baseball/integration/ -q || true

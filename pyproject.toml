[project]
name = "espn-fantasy-baseball"
version = "1.0.0"
description = "ESPN Fantasy Baseball MCP plugin for Claude — matchup scouting, free agents, trade analysis, draft assistance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.0.0,<3.0.0",
    "urllib3<=2.2.3",
    "mcp[cli]>=1.20",
    "python-dotenv>=1.0.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.5",
]

[project.scripts]
espn-mcp = "mcp_server.server:run_server"
espn = "mcp_server.cli:main"

[project.optional-dependencies]
browser = ["playwright>=1.58.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["espn_api", "mcp_server"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "requests-mock>=1.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
